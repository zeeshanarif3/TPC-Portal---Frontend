services:
  database:
    image: mongo:6.0
    container_name: tpc_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - ./mongo-data:/data/db
    networks:
      - mern-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tpc_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - BACKEND_PORT=5000
      - MONGO_URI=mongodb://database:27017/mern-db 
      - JWT_SECRET=${JWT_SECRET}
    networks:
      - mern-network
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tpc_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - mern-network
    depends_on:
      - backend

networks:
  mern-network:
    driver: bridge
